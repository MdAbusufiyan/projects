{% extends "base.html" %}
{% block title %}Professor Login{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h2>Professor Login</h2>
  <form method="POST" action="{{ url_for('auth.professor_login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" required maxlength="255">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
  </form>
  <p style="margin-top:16px;font-size:13px;">No account? <a href="{{ url_for('auth.professor_register') }}">Register</a></p>
</div>
{% endblock %}
