{% extends "base.html" %}
{% block title %}Join Exam{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h2>{{ exam.title }}</h2>
  <p style="font-size:13px;color:#5b6472;">{{ exam.description }}</p>
  <form method="POST" action="{{ url_for('candidate.join', exam_id=exam.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if token %}<input type="hidden" name="token" value="{{ token }}">{% endif %}
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" name="name" required maxlength="255">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" required maxlength="255">
    </div>
    {% if exam.access_mode == 'password' %}
    <div class="form-group">
      <label>Exam Password</label>
      <input type="text" name="password" required>
    </div>
    {% endif %}
    <button type="submit" class="btn btn-primary" style="width:100%;">Enter Exam</button>
  </form>
</div>
{% endblock %}
